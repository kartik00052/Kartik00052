<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="460" rx="8" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1"/>

  <rect x="0" y="0" width="720" height="32" rx="8" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="8" fill="#161b22"/>
  <text x="360" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600"
        fill="#8b949e" text-anchor="middle" letter-spacing="2">JOURNEY ROADMAP</text>

  <!-- Timeline line -->
  <line x1="70" y1="70" x2="70" y2="430" stroke="#21262d" stroke-width="2"/>
  <line x1="70" y1="70" x2="70" y2="430" stroke="url(#timelineGrad)" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="720;0" dur="3s" fill="freeze"/>
  </line>

  <!-- 2024 -->
  <circle cx="70" cy="95" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="70" cy="95" r="4" fill="#58a6ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="75" width="580" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="116" y="94" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#58a6ff">2024</text>
  <text x="180" y="94" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Started AI/ML journey — began with Python, mathematics, and fundamentals</text>
  <text x="640" y="94" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="end">BEGIN</text>

  <!-- Arrow -->
  <line x1="70" y1="115" x2="70" y2="145" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="66,140 70,150 74,140" fill="#30363d"/>

  <!-- 2025 -->
  <circle cx="70" cy="155" r="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="70" cy="155" r="4" fill="#8b5cf6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="135" width="580" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="116" y="154" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b5cf6">2025</text>
  <text x="180" y="154" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Machine Learning — scikit-learn, XGBoost, EDA, experiment tracking</text>

  <line x1="70" y1="175" x2="70" y2="205" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="66,200 70,210 74,200" fill="#30363d"/>

  <!-- 2026 H1 -->
  <circle cx="70" cy="215" r="8" fill="#0d1117" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="70" cy="215" r="4" fill="#3b82f6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="195" width="580" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="116" y="214" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#3b82f6">2026</text>
  <text x="180" y="214" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Deep Learning &amp; GenAI — PyTorch, CNNs, RNNs, Transformers, GANs</text>

  <line x1="70" y1="235" x2="70" y2="265" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="66,260 70,270 74,260" fill="#30363d"/>

  <!-- 2026 H2 -->
  <circle cx="70" cy="275" r="8" fill="#0d1117" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="70" cy="275" r="4" fill="#f59e0b" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="255" width="580" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="116" y="274" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#f59e0b">2026</text>
  <text x="180" y="274" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Agentic AI — LangGraph, CrewAI, Multi-Agent Systems, Tool Calling</text>

  <line x1="70" y1="295" x2="70" y2="325" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="66,320 70,330 74,320" fill="#30363d"/>

  <!-- Next -->
  <circle cx="70" cy="335" r="8" fill="#0d1117" stroke="#10b981" stroke-width="2"/>
  <circle cx="70" cy="335" r="4" fill="#10b981" filter="url(#glow)">
    <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="315" width="580" height="40" rx="6" fill="#161b22" stroke="#10b981" stroke-width="0.5"/>
  <text x="116" y="334" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#10b981">NEXT</text>
  <text x="180" y="334" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Research &amp; MCP — Distributed AI, Inference Optimization, MCP Servers</text>

  <line x1="70" y1="355" x2="70" y2="385" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="66,380 70,390 74,380" fill="#30363d"/>

  <!-- Future -->
  <circle cx="70" cy="395" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="70" cy="395" r="4" fill="none" stroke="#58a6ff" stroke-width="1">
    <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="100" y="375" width="580" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="116" y="394" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#58a6ff">FUTURE</text>
  <text x="180" y="394" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">AI Engineer — Building the next generation of intelligent systems</text>
  <text x="640" y="394" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="end">TARGET</text>

  <text x="360" y="445" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="2">CONTINUOUS LEARNING · RELENTLESS BUILDING</text>
</svg>
