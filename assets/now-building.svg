<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="260" rx="8" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1"/>

  <rect x="0" y="0" width="720" height="32" rx="8" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="8" fill="#161b22"/>
  <text x="360" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600"
        fill="#8b949e" text-anchor="middle" letter-spacing="2">NOW BUILDING</text>

  <rect x="28" y="48" width="300" height="24" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="178" y="64" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">AetherML</text>

  <text x="28" y="96" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Enterprise Agentic ML Platform</text>

  <text x="28" y="118" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Progress</text>
  <rect x="100" y="108" width="160" height="8" rx="4" fill="#21262d"/>
  <rect x="100" y="108" width="147" height="8" rx="4" fill="url(#progressGrad)" filter="url(#glow)">
    <animate attributeName="width" values="0;147;147" dur="2s" fill="freeze"/>
  </rect>
  <text x="272" y="118" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#58a6ff">92%</text>

  <text x="28" y="142" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Sprint</text>
  <text x="100" y="142" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">Agent Orchestration &amp; CLI</text>

  <text x="28" y="166" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">ETA</text>
  <text x="100" y="166" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#10b981">v1.0 — Q3 2026</text>

  <line x1="28" y1="182" x2="692" y2="182" stroke="#21262d" stroke-width="1"/>

  <text x="360" y="202" font-family="'Courier New', monospace" font-size="10" fill="#484f58" text-anchor="middle" letter-spacing="1">PROGRESS MILESTONES</text>

  <text x="28" y="224" font-family="'Courier New', monospace" font-size="11" fill="#10b981">✓</text>
  <text x="50" y="224" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Project scaffold &amp; architecture</text>

  <text x="28" y="244" font-family="'Courier New', monospace" font-size="11" fill="#10b981">✓</text>
  <text x="50" y="244" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Core agent framework &amp; workflow engine</text>
</svg>
