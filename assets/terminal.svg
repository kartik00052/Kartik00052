<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="460" rx="8" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1"/>

  <rect x="0" y="0" width="720" height="32" rx="8" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="8" fill="#161b22"/>

  <circle cx="16" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="32" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>

  <text x="360" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600"
        fill="#8b949e" text-anchor="middle" letter-spacing="2">NEURAL INTERFACE — TERMINAL v1.0</text>

  <text x="28" y="62" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Initializing Neural Interface...</text>
  <text x="28" y="62" font-family="'Courier New', monospace" font-size="12" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="3"/>
    Initializing Neural Interface...
  </text>

  <text x="28" y="82" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Loading AI Modules...</text>
  <text x="28" y="82" font-family="'Courier New', monospace" font-size="12" fill="#27c93f">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1s" fill="freeze"/>
    Loading AI Modules...
  </text>

  <text x="28" y="108" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Machine Learning</text>
  <rect x="200" y="98" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="98" width="200" height="8" rx="4" fill="#58a6ff" filter="url(#glow)">
    <animate attributeName="width" values="0;200;200" dur="1.5s" begin="1.2s" fill="freeze"/>
  </rect>

  <text x="28" y="128" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Deep Learning</text>
  <rect x="200" y="118" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="118" width="200" height="8" rx="4" fill="#8b5cf6" filter="url(#glow)">
    <animate attributeName="width" values="0;200;200" dur="1.5s" begin="1.5s" fill="freeze"/>
  </rect>

  <text x="28" y="148" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">LLMs</text>
  <rect x="200" y="138" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="138" width="190" height="8" rx="4" fill="#3b82f6" filter="url(#glow)">
    <animate attributeName="width" values="0;190;190" dur="1.5s" begin="1.8s" fill="freeze"/>
  </rect>

  <text x="28" y="168" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Agentic AI</text>
  <rect x="200" y="158" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="158" width="200" height="8" rx="4" fill="#10b981" filter="url(#glow)">
    <animate attributeName="width" values="0;200;200" dur="1.5s" begin="2.1s" fill="freeze"/>
  </rect>

  <text x="28" y="188" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">FastAPI</text>
  <rect x="200" y="178" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="178" width="180" height="8" rx="4" fill="#f59e0b" filter="url(#glow)">
    <animate attributeName="width" values="0;180;180" dur="1.5s" begin="2.4s" fill="freeze"/>
  </rect>

  <text x="28" y="208" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Docker</text>
  <rect x="200" y="198" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="198" width="170" height="8" rx="4" fill="#2496ed" filter="url(#glow)">
    <animate attributeName="width" values="0;170;170" dur="1.5s" begin="2.7s" fill="freeze"/>
  </rect>

  <text x="28" y="228" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">CUDA</text>
  <rect x="200" y="218" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="200" y="218" width="155" height="8" rx="4" fill="#76b900" filter="url(#glow)">
    <animate attributeName="width" values="0;155;155" dur="1.5s" begin="3s" fill="freeze"/>
  </rect>

  <text x="28" y="260" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#27c93f">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.5s" fill="freeze"/>
    ✓ All modules loaded. System ready.
  </text>

  <line x1="28" y1="278" x2="692" y2="278" stroke="#21262d" stroke-width="1"/>
  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4s" fill="freeze"/>

  <text x="28" y="300" font-family="'Courier New', monospace" font-size="13" fill="#27c93f">$</text>
  <text x="48" y="300" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">whoami</text>
  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.2s" fill="freeze"/>

  <text x="28" y="325" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" font-weight="600">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.6s" fill="freeze"/>
    Kartik Sharma
  </text>
  <text x="28" y="345" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.8s" fill="freeze"/>
    AI Engineer · ML Researcher · Backend Developer
  </text>

  <line x1="28" y1="360" x2="692" y2="360" stroke="#21262d" stroke-width="1"/>
  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.2s" fill="freeze"/>

  <text x="28" y="382" font-family="'Courier New', monospace" font-size="13" fill="#27c93f">$</text>
  <text x="48" y="382" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">current_project</text>
  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.4s" fill="freeze"/>

  <text x="28" y="407" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" font-weight="600">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.8s" fill="freeze"/>
    AetherML
  </text>
  <text x="160" y="407" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="6s" fill="freeze"/>
    Enterprise Agentic ML Platform
  </text>

  <text x="28" y="430" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Status</text>
  <rect x="100" y="420" width="200" height="8" rx="4" fill="#21262d"/>
  <rect x="100" y="420" width="184" height="8" rx="4" fill="url(#barGrad)" filter="url(#glow)">
    <animate attributeName="width" values="0;184;184" dur="1s" begin="6.5s" fill="freeze"/>
  </rect>
  <text x="315" y="430" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#10b981">92%</text>

  <text x="28" y="455" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="7s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" begin="8s"/>
    ▊
  </text>
</svg>
