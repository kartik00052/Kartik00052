    <line x1="85" y1="120" x2="195" y2="135"/>
    <line x1="85" y1="120" x2="195" y2="170"/>
    <line x1="85" y1="120" x2="195" y2="205"/>
    <line x1="85" y1="150" x2="195" y2="100"/>
    <line x1="85" y1="150" x2="195" y2="135"/>
    <line x1="85" y1="150" x2="195" y2="170"/>
    <line x1="85" y1="150" x2="195" y2="205"/>
