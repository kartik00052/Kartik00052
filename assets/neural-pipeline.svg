    <text x="679" y="294" font-family="'Courier New', monospace" font-size="7" fill="#58a6ff" text-anchor="middle">Feedback</text>
  </g>

  <!-- Feedback loop arrow going back -->
  <path d="M 679 304 L 679 330 L 57 330 L 57 304" fill="none" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polygon points="57,308 50,304 57,300" fill="#58a6ff" opacity="0.5">
