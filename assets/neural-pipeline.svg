  <!-- Neural Network Layer -->
  <text x="360" y="52" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="3">NEURAL TOPOLOGY</text>

  <!-- Input layer nodes (3) -->
  <circle cx="80" cy="120" r="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="80" cy="150" r="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="80" cy="180" r="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>

  <!-- Hidden layer 1 nodes (4) -->
  <circle cx="200" cy="100" r="5" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="200" cy="135" r="5" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="200" cy="170" r="5" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="200" cy="205" r="5" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>

  <!-- Hidden layer 2 nodes (4) -->
  <circle cx="330" cy="100" r="5" fill="#21262d" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="330" cy="135" r="5" fill="#21262d" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="330" cy="170" r="5" fill="#21262d" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="330" cy="205" r="5" fill="#21262d" stroke="#3b82f6" stroke-width="1"/>

