  </g>
  <g>
    <line x1="518" y1="291" x2="542" y2="291" stroke="#30363d" stroke-width="1"/>
    <polygon points="542,287 550,291 542,295" fill="#30363d"/>
    <line x1="518" y1="291" x2="542" y2="291" stroke="#ef4444" stroke-width="0.5" opacity="0.6">
