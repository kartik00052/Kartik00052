    <line x1="205" y1="100" x2="325" y2="135"/>
    <line x1="205" y1="100" x2="325" y2="170"/>
    <line x1="205" y1="100" x2="325" y2="205"/>
    <line x1="205" y1="135" x2="325" y2="100"/>
    <line x1="205" y1="135" x2="325" y2="135"/>
    <line x1="205" y1="135" x2="325" y2="170"/>
    <line x1="205" y1="135" x2="325" y2="205"/>
    <line x1="205" y1="170" x2="325" y2="100"/>
    <line x1="205" y1="170" x2="325" y2="135"/>
    <line x1="205" y1="170" x2="325" y2="170"/>
    <line x1="205" y1="170" x2="325" y2="205"/>
    <line x1="205" y1="205" x2="325" y2="100"/>
    <line x1="205" y1="205" x2="325" y2="135"/>
