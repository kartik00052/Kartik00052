    <line x1="85" y1="150" x2="195" y2="135"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="0.5s" repeatCount="indefinite"/></line>
    <line x1="85" y1="180" x2="195" y2="170"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/></line>
  </g>

