  <text x="360" y="380" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="middle">→ AUTOMATED PIPELINE RUNNING IN PRODUCTION</text>

  <text x="360" y="405" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">
