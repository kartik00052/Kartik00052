<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="barAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barDL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="barAgent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barBackend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barCloud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="barOS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="440" rx="8" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1"/>

  <rect x="0" y="0" width="720" height="36" rx="8" fill="#161b22"/>
  <rect x="0" y="28" width="720" height="8" fill="#161b22"/>

  <circle cx="18" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="18" r="5" fill="#27c93f"/>

  <text x="360" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600"
        fill="#8b949e" text-anchor="middle" letter-spacing="2">AI SYSTEM DASHBOARD</text>
  <text x="690" y="23" font-family="'Courier New', monospace" font-size="10" fill="#484f58" text-anchor="end">v2.4.1</text>

  <text x="28" y="63" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="2">MODULE</text>
  <text x="420" y="63" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="2">STATUS</text>
  <text x="620" y="63" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="2">LOAD</text>

  <line x1="28" y1="70" x2="692" y2="70" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="95" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">AI Research</text>
  <rect x="380" y="83" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="83" width="218" height="10" rx="5" fill="url(#barAI)" filter="url(#glow)">
    <animate attributeName="width" values="0;218;218" dur="2s" fill="freeze"/>
  </rect>
  <text x="636" y="95" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#58a6ff">91%</text>

  <text x="28" y="120" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Deep Learning</text>
  <rect x="380" y="108" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="108" width="197" height="10" rx="5" fill="url(#barDL)" filter="url(#glow)">
    <animate attributeName="width" values="0;197;197" dur="2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="636" y="120" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#8b5cf6">82%</text>

  <text x="28" y="145" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Agentic AI</text>
  <rect x="380" y="133" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="133" width="240" height="10" rx="5" fill="url(#barAgent)" filter="url(#glow)">
    <animate attributeName="width" values="0;240;240" dur="2s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="636" y="145" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#10b981">100%</text>

  <text x="28" y="170" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Backend</text>
  <rect x="380" y="158" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="158" width="178" height="10" rx="5" fill="url(#barBackend)" filter="url(#glow)">
    <animate attributeName="width" values="0;178;178" dur="2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="636" y="170" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#f59e0b">74%</text>

  <text x="28" y="195" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Cloud</text>
  <rect x="380" y="183" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="183" width="151" height="10" rx="5" fill="url(#barCloud)" filter="url(#glow)">
    <animate attributeName="width" values="0;151;151" dur="2s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="636" y="195" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#ef4444">63%</text>

  <text x="28" y="220" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Open Source</text>
  <rect x="380" y="208" width="240" height="10" rx="5" fill="#21262d"/>
  <rect x="380" y="208" width="209" height="10" rx="5" fill="url(#barOS)" filter="url(#glow)">
    <animate attributeName="width" values="0;209;209" dur="2s" begin="1s" fill="freeze"/>
  </rect>
  <text x="636" y="220" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#58a6ff">87%</text>

  <line x1="28" y1="238" x2="692" y2="238" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="260" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="2">CURRENT MISSION</text>
  <text x="28" y="283" font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9">Building Enterprise Agentic AI Systems with Multi-Agent Orchestration...</text>
  <rect x="28" y="293" width="664" height="1" fill="#21262d"/>
  <rect x="28" y="293" width="400" height="1" fill="#10b981">
    <animate attributeName="width" values="0;664;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <line x1="28" y1="310" x2="692" y2="310" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="335" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="2">SYSTEM METRICS</text>

  <text x="28" y="365" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Last Commit</text>
  <text x="160" y="365" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#c9d1d9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    ● LIVE
  </text>

  <text x="330" y="365" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Repositories</text>
  <text x="440" y="365" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#58a6ff">17</text>

  <text x="520" y="365" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Followers</text>
  <text x="610" y="365" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    ● LIVE
  </text>

  <text x="28" y="395" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">System Status</text>
  <text x="160" y="395" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#10b981">
    ● ONLINE
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <text x="330" y="395" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Uptime</text>
  <text x="410" y="395" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#c9d1d9">99.97%</text>

  <text x="520" y="395" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Active Agents</text>
  <text x="630" y="395" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#10b981">4</text>

  <line x1="28" y1="410" x2="692" y2="410" stroke="#21262d" stroke-width="1"/>
  <text x="360" y="428" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="middle">LAST UPDATED: DAILY VIA GITHUB ACTIONS</text>
</svg>
