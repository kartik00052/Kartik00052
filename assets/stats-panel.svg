  <text x="360" y="135" font-family="'Courier New', monospace" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="2">TOP TECHNOLOGIES</text>

  <text x="360" y="158" font-family="'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">
